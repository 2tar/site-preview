<script>
window.dataLayer = window.dataLayer || [];
window.dipinkRelay = window.dipinkRelay || {
	done: false,
	complete: function() {
		window.dipinkRelay.done = true;
		if (typeof window.dipinkRelay.onComplete === "function") {
			window.dipinkRelay.onComplete();
		}
	}
};
(function() {
	var params = new URLSearchParams(window.location.search);
	var tk = params.get("tk");
	var adid = params.get("adid");

	if (!tk || !adid) {
		try {
			var stored = (window.sessionStorage.getItem("custom_data") || "").split("_");
			if (stored.length === 2 && stored[0] && stored[1]) {
				tk = stored[0];
				adid = stored[1];
			}
		} catch (error) {
			return;
		}
	}

	if (!tk || !adid) {
		return;
	}

	try {
		window.sessionStorage.setItem("custom_data", tk + "_" + adid);
		window.sessionStorage.setItem("custom_data_params", JSON.stringify([tk, adid]));
	} catch (error) {}

	window.dataLayer.push({
		event: "dipink_relay",
		custom_data: tk + "_" + adid
	});
})();
</script>
